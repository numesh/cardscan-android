name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build library, demo, and test APKs
        run: ./gradlew :cardscan:assembleRelease :cardscan:assembleDebugAndroidTest :demo:assembleDebug :demo:assembleDebugAndroidTest --no-daemon
